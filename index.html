<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday TEMUULEN!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d0e15;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(22, 27, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Neon Glow Effect */
        .neon-glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        }

        .neon-text-pink {
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.7), 0 0 30px rgba(244, 63, 94, 0.4);
        }

        .neon-text-gold {
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.7), 0 0 30px rgba(234, 179, 8, 0.4);
        }

        /* Party Mode Flash Background */
        @keyframes partyGlow {
            0% { background-color: #0d0e15; }
            25% { background-color: #1e102d; }
            50% { background-color: #11282c; }
            75% { background-color: #2b1219; }
            100% { background-color: #0d0e15; }
        }

        .party-active {
            animation: partyGlow 3s infinite ease-in-out;
        }

        /* Candle Flame Animation */
        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-1deg); opacity: 0.95; }
            50% { transform: scale(1.15) rotate(1deg); opacity: 1; filter: drop-shadow(0 0 12px #ffaa00); }
        }

        .flame {
            animation: flicker 0.6s infinite alternate ease-in-out;
            transform-origin: center bottom;
        }

        .flame-extinguished {
            display: none !important;
        }

        /* Float effect */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        /* Smoke Effect when blowing out candle */
        @keyframes smoke {
            0% { opacity: 0.8; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-25px) scale(2); }
        }

        .smoke-puff {
            animation: smoke 1s forwards ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative py-8 px-4 transition-colors duration-700" id="mainBody">

    <header class="w-full max-w-4xl flex justify-between items-center mb-6 z-10 px-2">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🕶️</span>
        </div>
        <div class="flex gap-3">
            <button id="partyBtn" onclick="togglePartyMode()" class="px-4 py-2 rounded-full glass-card hover:border-pink-500/50 text-xs sm:text-sm font-semibold flex items-center gap-2 transition hover:scale-105 active:scale-95">
                <i class="fa-solid fa-bolt text-yellow-400" id="partyIcon"></i>
                <span id="partyBtnText">Party Mode</span>
            </button>
        </div>
    </header>

    <main class="w-full max-w-2xl glass-card rounded-3xl p-6 sm:p-10 text-center relative z-10 border border-white/10 my-auto">
        
        <!-- Badge -->
        <div class="inline-block px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-semibold text-xs sm:text-sm tracking-widest uppercase mb-4 floating">
            🔥 Level Up Day 🔥
        </div>

        <!-- Glowing Headline -->
        <h1 class="text-3xl sm:text-5xl font-extrabold uppercase tracking-tight text-white mb-6">
            Happy 18 <span class="neon-text-pink text-pink-500 inline-block hover:scale-105 transition-transform duration-300">TEMUULEN!</span>
        </h1>

        <div class="relative w-64 h-80 sm:w-72 sm:h-96 mx-auto mb-8 group">
            <!-- Neon Frame Border -->
            <div class="absolute -inset-1.5 bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 rounded-2xl blur opacity-75 group-hover:opacity-100 transition duration-500 group-hover:blur-md"></div>
            
            <!-- Picture Wrapper -->
            <div class="relative w-full h-full rounded-2xl overflow-hidden border-2 border-white/20 bg-slate-900 shadow-2xl flex items-center justify-center">
                <img src="8C4842D3-24EA-46EA-932F-596F6371F8B5_1_105_c.jpeg" alt="Birthday Legend" id="heroImage" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" >
                
                <!-- Cool Overlay Tag -->
                <div class="absolute bottom-3 left-3 right-3 py-2 px-3 bg-black/60 backdrop-blur-md rounded-xl border border-white/10 text-left flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold text-cyan-400">100% UNMATCHED VIBES</p>
                        <p class="text-[10px] text-gray-300">Shades & Stache Certified</p>
                    </div>
                    <span class="text-lg">👑</span>
                </div>
            </div>
        </div>

        <p class="text-gray-300 text-base sm:text-lg max-w-lg mx-auto mb-8 leading-relaxed">
             <span class="text-cyan-400 font-bold">Goy zalu shu</span>
        </p>

        <div class="bg-black/30 rounded-2xl p-6 border border-white/5 mb-8 flex flex-col items-center">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-400 mb-4">
                <i class="fa-solid fa-cake-candles text-pink-400 mr-2"></i>Лаагаа үлээгээрэй
            </h3>
            
            <!-- SVG Interactive Birthday Cake -->
            <div class="relative cursor-pointer select-none py-2" onclick="blowCandles()">
                <svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-lg">
                    <!-- Candle 1 -->
                    <rect x="65" y="30" width="10" height="30" rx="3" fill="#06B6D4" />
                    <!-- Candle 1 Flame -->
                    <path class="flame flame-1" d="M70 12 C70 12 64 22 70 28 C76 22 70 12 70 12Z" fill="#F59E0B" />
                    <path class="flame flame-1" d="M70 16 C70 16 67 22 70 26 C73 22 70 16 70 16Z" fill="#EF4444" />

                    <!-- Candle 2 (Middle) -->
                    <rect x="95" y="20" width="10" height="40" rx="3" fill="#EC4899" />
                    <!-- Candle 2 Flame -->
                    <path class="flame flame-2" d="M100 2 C100 2 94 12 100 18 C106 12 100 2 100 2Z" fill="#F59E0B" />
                    <path class="flame flame-2" d="M100 6 C100 6 97 12 100 16 C103 12 100 6 100 6Z" fill="#EF4444" />

                    <!-- Candle 3 -->
                    <rect x="125" y="30" width="10" height="30" rx="3" fill="#3B82F6" />
                    <!-- Candle 3 Flame -->
                    <path class="flame flame-3" d="M130 12 C130 12 124 22 130 28 C136 22 130 12 130 12Z" fill="#F59E0B" />
                    <path class="flame flame-3" d="M130 16 C130 16 127 22 130 26 C133 22 130 16 130 16Z" fill="#EF4444" />

                    <!-- Cake Top Layer -->
                    <rect x="40" y="60" width="120" height="35" rx="8" fill="#334155" />
                    <!-- Frosting Dripping -->
                    <path d="M40 68 C50 78 60 65 70 75 C80 65 90 78 100 68 C110 78 120 65 130 75 C140 65 150 78 160 68 V60 H40 V68 Z" fill="#EC4899" />
                    
                    <!-- Cake Bottom Layer -->
                    <rect x="30" y="95" width="140" height="45" rx="8" fill="#1E293B" />
                    <path d="M30 102 C42 110 54 98 66 108 C78 98 90 110 102 100 C114 110 126 98 138 108 C150 98 162 108 170 102 V95 H30 V102 Z" fill="#06B6D4" />

                    <!-- Cake Plate -->
                    <ellipse cx="100" cy="142" rx="80" ry="6" fill="#64748B" />
                </svg>
            </div>
            <p id="cakeStatus" class="text-xs text-gray-400 mt-2 italic">Дараад лаа нь үлээгднэ</p>
        </div>
    </script>
</body>
</html>
